name: Map gallery

on:
  push:
    branches:
      - master
    paths:
      - "src/data/maps.ts"
      - "src/data/gamemodes.ts"
      - "maps/*.txt"
      - "mapeditor/seed.cjs"
      - "mapeditor/center-maps.cjs"
      - "mapeditor/render-gallery.cjs"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: map-gallery
  cancel-in-progress: false

jobs:
  gallery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Regenerate map data + gallery
        run: |
          node mapeditor/seed.cjs
          node mapeditor/render-gallery.cjs
      - name: Commit regenerated gallery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add maps/index.json maps/curated.json maps/modes.json mapeditor/gallery
          if git diff --cached --quiet; then
            echo "Gallery is up to date."
          else
            git commit -m "chore: regenerate map gallery [skip ci]"
            git fetch origin master
            git rebase origin/master
            git push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:master
          fi
