name: Map proposal → PR

on:
  issues:
    types: [opened]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: map-proposals
  cancel-in-progress: false

jobs:
  map-pr:
    if: startsWith(github.event.issue.title, 'Map: ')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create PR from issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          N=${{ github.event.issue.number }}
          TITLE=$(gh api repos/${{ github.repository }}/issues/$N --jq .title)
          BODY=$(gh api repos/${{ github.repository }}/issues/$N --jq .body | tr -d '\r')
          NAME=$(printf '%s' "$TITLE" | sed 's/^Map: //' | sed 's/[[:space:]]*$//')
          NAME_SAFE=$(printf '%s' "$NAME" | tr -cd 'a-zA-Z0-9_-')
          if [ "$NAME_SAFE" != "$NAME" ]; then
            gh issue comment $N --body "Map name **$NAME** has characters that aren't allowed in file names (letters, numbers, - and _ only). Rename it and open a new proposal."
            gh issue close $N
            exit 0
          fi
          NAME=$NAME_SAFE
          CONTENT=$(printf '%s' "$BODY" | awk '/^```txt/{f=1;next} f&&/^```/{f=0} f{print}')
          MODES=$(printf '%s' "$BODY" | sed -n 's/^Modes:[[:space:]]*//p' | head -1)
          if [ -z "$CONTENT" ]; then
            gh issue comment $N --body "Couldn't find the map text (a \`\`\`txt\`\`\` code block) in the issue body."
            exit 1
          fi
          if git cat-file -e "HEAD:maps/$NAME.txt" 2>/dev/null; then
            gh issue comment $N --body "A map named **$NAME** already exists in \`maps/\` — closing this proposal."
            gh issue close $N
            exit 0
          fi
          BRANCH="map/$(printf '%s' "$NAME" | tr '[:upper:] ' '[:lower:]-' | tr -cd 'a-z0-9-')"
          if git ls-remote --exit-code origin "refs/heads/$BRANCH" >/dev/null 2>&1; then
            gh issue comment $N --body "A pull request for **$NAME** is already open — closing this duplicate proposal."
            gh issue close $N
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          if [ -n "$MODES" ]; then
            printf '# Modes: %s\n' "$MODES" > "maps/$NAME.txt"
            printf '%s\n' "$CONTENT" >> "maps/$NAME.txt"
          else
            printf '%s\n' "$CONTENT" > "maps/$NAME.txt"
          fi
          git add "maps/$NAME.txt"
          git commit -m "Add map $NAME (from issue #$N)"
          git push -u origin "$BRANCH"
          if [ -n "$MODES" ]; then
            PR_URL=$(gh pr create --title "Add map $NAME" --body "Auto-created from issue #$N. Modes: $MODES")
          else
            PR_URL=$(gh pr create --title "Add map $NAME" --body "Auto-created from issue #$N.")
          fi
          gh issue comment $N --body "Opened **$PR_URL** — the map was committed to \`maps/$NAME.txt\` and a pull request was created."
          gh issue close $N
