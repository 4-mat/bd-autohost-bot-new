name: Discord major-release notification

on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to announce (e.g. v2.0.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  notify:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      endsWith(github.event.release.tag_name, '.0.0') ||
      github.event.release.tag_name == '0.1.0' ||
      github.event.release.tag_name == 'v0.1.0'
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord webhook
        env:
          GH_TOKEN: ${{ github.token }}
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # Fallback is the default `super turbo` role; set the
          # DISCORD_ROLE_ID secret to override (see RELEASE_GUIDE.md).
          ROLE_ID: ${{ secrets.DISCORD_ROLE_ID || '1535455535896334467' }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Manual run: resolve the selected release's real metadata from
            # the GitHub API so the announcement matches it (no more hard-coded
            # v1.0.0 fallbacks). Fails loudly if the tag does not exist.
            RELEASE=$(gh api "repos/${{ github.repository }}/releases/tags/${{ inputs.release_tag }}")
            TAG=$(printf '%s' "$RELEASE" | jq -r '.tag_name')
            NAME=$(printf '%s' "$RELEASE" | jq -r '.name // ""')
            URL=$(printf '%s' "$RELEASE" | jq -r '.html_url')
            BODY=$(printf '%s' "$RELEASE" | jq -r '.body // ""')
          else
            TAG="${{ github.event.release.tag_name }}"
            NAME="${{ github.event.release.name }}"
            URL="${{ github.event.release.html_url }}"
            BODY="${{ github.event.release.body }}"
          fi
          # NOTE: the jq program is intentionally a single line — multi-line
          # single-quoted jq breaks when this file is checked out with CRLF.
          body=$(jq -n --arg role "$ROLE_ID" --arg tag "$TAG" --arg name "$NAME" --arg url "$URL" --arg body "$BODY" 'def utf16len: [explode[] | if . > 65535 then 2 else 1 end] | add; def utf16trunc($n): reduce (explode | to_entries[]) as $e ({units: 0, chars: []}; if .units + (if $e.value > 65535 then 2 else 1 end) <= $n then .units += (if $e.value > 65535 then 2 else 1 end) | .chars += [$e.value] else . end) | .chars | implode; { content: ("<@&" + $role + "> **" + $tag + "**"), embeds: [{ title: ("🚀 Battle Dome Autohost — " + $tag), description: (if ($name | length) > 0 then $name else $tag end), url: $url, color: 15548997, fields: [{ name: "Release notes", value: (if ($body | length) > 0 then (if ($body | utf16len) > 1024 then ($body | utf16trunc(1021)) + "..." else $body end) else "See the release for details." end) }] }] }')
          curl -sS --fail-with-body --connect-timeout 10 --max-time 30 \
            -H "Content-Type: application/json" \
            -d "$body" \
            "$WEBHOOK_URL" || exit 1
