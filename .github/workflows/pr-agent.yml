name: PR Agent

on:
  pull_request:
    types: [opened, synchronize]
  issue_comment:
    types: [created]

permissions:
  issues: write
  pull-requests: write
  contents: read

jobs:
  pr_agent_job:
    runs-on: ubuntu-latest
    if: github.event.sender.type != 'Bot'
    steps:
      - name: PR Agent action step
        id: pragent
        uses: The-PR-Agent/pr-agent@v0.41.1
        env:
          GOOGLE_AI_STUDIO.GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          # Re-review on every push (synchronize), not just on open. Without
          # handle_push_trigger PR-Agent logs "Skipping action: synchronize"
          # and never re-reviews a branch after its first review.
          github_action_config.handle_push_trigger: "true"
          github_action_config.push_commands: '["/review", "/improve"]'
