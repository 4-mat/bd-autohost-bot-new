name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core (typecheck + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      # Lenient install matches the repo's existing convention (ability-pr.yml):
      # frozen fails only on lockfile drift, and the gate's real job is
      # typecheck + tests, not lockfile policing.
      - name: Install dependencies
        run: bun install --frozen-lockfile 2>/dev/null || bun install

      - name: Typecheck
        run: bun run typecheck

      # Scoped to src/: the discord-issue-bot has its own package + lockfile
      # and imports discord.js (not present in root node_modules) — the bot
      # job below covers it.
      - name: Test
        run: bun test src

  bot:
    name: Discord bot (typecheck + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: discord-issue-bot
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      # Skip until the discord-issue-bot package exists on the base branch
      # (it lands with PR #199). This must be a step-level check: a job-level
      # hashFiles() is evaluated before checkout (workspace is empty), so it
      # would always skip the job.
      - name: Check for bot package
        id: check_bot
        working-directory: .
        run: echo "exists=$([ -f discord-issue-bot/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        if: steps.check_bot.outputs.exists == 'true'
        run: bun install --frozen-lockfile 2>/dev/null || bun install

      - name: Typecheck
        if: steps.check_bot.outputs.exists == 'true'
        run: bun run typecheck

      - name: Test
        if: steps.check_bot.outputs.exists == 'true'
        run: bun test
