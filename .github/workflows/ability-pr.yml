name: Ability proposal → PR

on:
  issues:
    types: [opened]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: ability-proposals
  cancel-in-progress: false

jobs:
  ability-pr:
    # Public repo: only trusted users may trigger the branch-pushing workflow.
    if: >-
      ${{ startsWith(github.event.issue.title, 'Ability: ') &&
          (github.event.issue.author_association == 'COLLABORATOR' ||
           github.event.issue.author_association == 'MEMBER' ||
           github.event.issue.author_association == 'OWNER') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Apply proposal from issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          N=${{ github.event.issue.number }}
          BODY=$(gh api repos/${{ github.repository }}/issues/$N --jq .body | tr -d '\r')
          printf '%s' "$BODY" | awk '/^```json/{f=1;next} f&&/^```/{f=0} f{print}' > /tmp/ability-proposal.json
          if [ ! -s /tmp/ability-proposal.json ]; then
            gh issue comment $N --body "Couldn't find the proposal payload (a \`\`\`json\`\`\` code block) in the issue body. Please use the Ability Editor demo to generate the proposal."
            gh issue close $N
            exit 0
          fi
          set +e
          OUT=$(bun scripts/apply-editor-proposal.ts /tmp/ability-proposal.json 2>&1)
          RC=$?
          set -e
          if [ $RC -ne 0 ]; then
            gh issue comment $N --body "The proposal didn't pass validation — $OUT"
            gh issue close $N
            exit 0
          fi
          if git diff --quiet src/data/index.ts; then
            gh issue comment $N --body "The proposal contains no actual changes to the bot data — closing."
            gh issue close $N
            exit 0
          fi
          # A broken diff must never reach reviewers: typecheck the regenerated
          # source before opening the PR.
          bun install --frozen-lockfile 2>/dev/null || bun install
          if ! bunx tsc --noEmit; then
            gh issue comment $N --body "The proposal produces code that doesn't typecheck — rejected. Please re-propose from the current demo data."
            gh issue close $N
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="ability/update-$N"
          if git ls-remote --exit-code origin "refs/heads/$BRANCH" >/dev/null 2>&1; then
            gh issue comment $N --body "A pull request for this proposal is already open — closing this duplicate proposal."
            gh issue close $N
            exit 0
          fi
          git checkout -b "$BRANCH"
          git add src/data/index.ts
          git commit -m "Apply ability editor proposal (from issue #$N)"
          git push -u origin "$BRANCH"
          PR_URL=$(gh pr create --title "Apply ability editor proposal" --body "Auto-created from issue #$N. $OUT")
          gh issue comment $N --body "Opened **$PR_URL** — $OUT"
          gh issue close $N
