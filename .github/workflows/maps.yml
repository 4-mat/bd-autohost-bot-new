name: Maps

on:
  pull_request:
    paths:
      - "maps/**"
      - "src/data/parse-map-file.ts"
      - "scripts/import-volunteer-maps.ts"
      - "src/data/volunteer-maps.ts"
      - ".github/workflows/maps.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      # bun install occasionally flakes on tarball extraction (e.g. "Fail
      # extracting tarball for xlsx"); retry a couple of times before giving up.
      - name: Install dependencies (with retry)
        run: |
          for i in 1 2 3; do
            if bun install; then
              exit 0
            fi
            echo "bun install failed (attempt $i/3), retrying..."
            sleep 5
          done
          exit 1

      - run: bun run maps
      - run: bun test
      - run: bun run typecheck
      - name: Generated file in sync
        run: |
          git diff --exit-code src/data/volunteer-maps.ts || {
            echo "::error::src/data/volunteer-maps.ts is out of date. Run 'bun run maps' and commit the result."
            exit 1
          }