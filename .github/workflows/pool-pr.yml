name: Pool proposal → PR
on:
  issues:
    types: [opened]
permissions:
  contents: write
  pull-requests: write
  issues: write
concurrency:
  group: pool-proposals
  cancel-in-progress: false
jobs:
  pool-pr:
    if: "${{ startsWith(github.event.issue.title, 'Pools: ') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create PR from issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          N=${{ github.event.issue.number }}
          BODY=$(gh api repos/${{ github.repository }}/issues/$N --jq .body | tr -d '\r')
          CHANGES=$(printf '%s' "$BODY" | grep -E '^(ffa|ntr|jugg|pvp|1v1)\|[+-]\|[A-Za-z0-9_-]+$' || true)
          if [ -z "$CHANGES" ]; then
            gh issue comment $N --body "Couldn't find any valid pool changes in the issue body (expected lines like `ffa|+|arena`). Closing."
            gh issue close $N
            exit 0
          fi
          export CHANGES
          node mapeditor/pool-validate.cjs
          UNKNOWN=$(node -p "require('/tmp/pool-result.json').unknown.join(', ')")
          if [ -n "$UNKNOWN" ]; then
            gh issue comment $N --body "These map names don't exist in \`maps/index.json\`: **$UNKNOWN**. Add the map first, then propose pool changes. Closing."
            gh issue close $N
            exit 0
          fi
          APPLIED=$(node -p "require('/tmp/pool-result.json').applied")
          if [ "$APPLIED" != "true" ]; then
            gh issue comment $N --body "No actual pool changes were needed — everything in the issue was already in that state. Closing."
            gh issue close $N
            exit 0
          fi
          SUMMARY=$(node -p "require('/tmp/pool-result.json').summary.join('; ')")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="pool/update-$N"
          git checkout -b "$BRANCH"
          git add maps/modes.json
          git commit -m "Update map pools (from issue #$N)"
          git push -u origin "$BRANCH"
          PR_URL=$(gh pr create --title "Update map pools" --body "Auto-created from issue #$N. Changes: $SUMMARY")
          gh issue comment $N --body "Opened **$PR_URL** with the pool changes. ($SUMMARY)"
          gh issue close $N
