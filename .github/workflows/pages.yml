name: Deploy Ability Editor demo

on:
  push:
    branches: [master]
    paths:
      - "abilityeditor/**"
      - "scripts/build-editor-demo.ts"
      - "scripts/apply-editor-proposal.ts"
      - "src/data/index.ts"
      - "src/data/overrides.ts"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Build demo
        run: bun scripts/build-editor-demo.ts

      # Keep the existing GitHub Pages site intact: the ability editor demo
      # lives at /ability-editor/ and the map editor/browser/pools keep their
      # current /mapeditor/ and /maps/ URLs (never clobber the root).
      - name: Assemble static site
        run: |
          mkdir -p dist-editor/ability-editor
          mv dist-editor/index.html dist-editor/ability-editor/index.html
          cp -r mapeditor dist-editor/mapeditor
          cp -r maps dist-editor/maps

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-editor

      - id: deployment
        uses: actions/deploy-pages@v4
