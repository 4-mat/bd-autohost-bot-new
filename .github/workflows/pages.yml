name: Deploy GitHub Pages site

on:
  push:
    branches: [master]
    paths:
      - "index.html"
      - "mapeditor/**"
      - "maps/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Assemble the site: the repo-root index.html is the homepage at /,
      # and the map editor/browser/pools keep their /mapeditor/ and /maps/ URLs.
      - name: Assemble static site
        run: |
          mkdir -p dist-editor
          cp index.html dist-editor/index.html
          cp -r mapeditor dist-editor/mapeditor
          cp -r maps dist-editor/maps

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-editor

      - id: deployment
        uses: actions/deploy-pages@v4
