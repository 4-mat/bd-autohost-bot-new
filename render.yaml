services:
  - type: web
    name: bd-autohost-test
    env: node
    plan: free
    # Deploys are driven by .github/workflows/render-deploy.yml (deploy hook,
    # concurrency-gated, supports [skip render]); autoDeploy is deprecated in
    # favor of autoDeployTrigger, and hook deploys with a ref disable auto
    # deploys anyway, so keep the trigger manual to avoid double deploys.
    autoDeployTrigger: manual
    buildCommand: npm install && npm run build
    startCommand: node dist/test-app.js
    envVars:
      - key: NODE_VERSION
        value: 20.14.0

  - type: worker
    name: bd-discord-issue-bot
    env: node
    plan: free
    buildCommand: cd discord-issue-bot && npm install
    startCommand: cd discord-issue-bot && npx tsx src/index.ts
    envVars:
      - key: NODE_VERSION
        value: 20.14.0
      - key: DISCORD_TOKEN
        sync: false
      - key: CLIENT_ID
        sync: false
      - key: GUILD_ID
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPO
        value: 4-mat/bd-autohost-bot-new
      - key: ROLE_ID
        sync: false
      - key: ROLE_NAME
        value: super turbo
