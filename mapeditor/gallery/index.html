<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Battle Dome — Map Browser</title>
<style>
	/* PokéArena-style light theme, like the in-game map browser */
	body {
		background: #f2f2f2;
		color: #222;
		font-family: Verdana, Tahoma, "Segoe UI", Arial, sans-serif;
		font-size: 12px;
		margin: 0;
	}
	#app { padding: 25px 80px; position: relative; }
	#app.wide { padding: 25px 40px; }

	a { color: #2b5e8c; }
	a:hover { color: #1a4a73; }

	.button {
		display: inline-block;
		padding: 4px 13px;
		margin: 3px 4px 3px 0;
		background: linear-gradient(#fdfdfd, #e2e2e2);
		border: 1px solid #8a8a8a;
		border-radius: 3px;
		color: #222;
		text-decoration: none;
		font-size: 12px;
		cursor: pointer;
	}
	.button:hover { background: linear-gradient(#ffffff, #d3d3d3); border-color: #555; }
	.button:active { background: linear-gradient(#d3d3d3, #e8e8e8); }
	.button.primary { background: linear-gradient(#eaf3fb, #cfe3f0); border-color: #6f93ad; }

	.nav-abs { position: absolute; top: 0; }
	.nav-left { left: 0; }
	.nav-right { right: 0; }

	h1 { font-size: 26px; margin: 4px 0 2px; font-weight: bold; }
	.map-info { color: #666; font-size: 12px; margin: 0 0 12px; }
	.center { text-align: center; }
	hr { border: 0; border-top: 1px solid #bbb; margin: 12px 0 16px; }

	/* the game's map table */
	table.bdmap {
		border-spacing: 0px;
		border-collapse: collapse;
		border: 1px solid #888;
		background: rgba(120, 120, 225, 0.10);
	}
	table.bdmap td {
		min-width: 22px;
		height: 24px;
		border: 1px solid #888;
		text-align: center;
		font-weight: bold;
		font-size: 11px;
		color: #222;
	}
	table.bdmap td.tile { font-weight: normal; }
	.map-stage { margin-top: 14px; }

	/* index sections */
	.mode-row { margin: 8px 0 14px; }
	.section { margin: 18px 0; }
	.section h2 {
		font-size: 14px;
		color: #333;
		border-bottom: 1px solid #ccc;
		padding-bottom: 3px;
		margin: 0 0 8px;
	}
	.map-links { line-height: 2.1; }
	.map-links a {
		display: inline-block;
		margin: 0 14px 0 0;
		font-size: 12.5px;
	}
	.map-links a small { color: #999; font-size: 10.5px; margin-left: 3px; }
	.muted { color: #888; font-size: 11px; }
	#status { color: #a33; font-size: 12px; margin: 10px 0; }
	@media (max-width: 700px) {
		#app, #app.wide { padding: 16px 12px; }
		.nav-abs { position: static; margin: 2px; }
	}
</style>
</head>
<body>
<div id="app" class="wide">
	<div id="topbar"></div>
	<hr>
	<div id="content"><p class="muted">Loading maps…</p></div>
</div>

<script src="../../mapeditor/mapcore.cjs"></script>
<script>
'use strict';
const MC = window.MapCore;

/* The classic in-game palette (normal #99e599, boost lilac #c8a2c8). */
const COLORS = {
	normal: '#99e599', stop: '#a9a9a9', water: '#454fdf', forest: '#226622',
	ice: '#33e9e9', air: '#b8d3de', sticky: '#cccc00', lava: '#8b0000',
	broken: '#000000', bone: '#ccccaa', stone: '#888888', hearth: '#ff6633',
	boost: '#c8a2c8'
};
const rowLabel = (i) => String.fromCharCode(65 + i);

let manifest = [];   // {name, display, format, file, rows, cols}
let curated = {};    // name -> {rows, cols, tiles}
let modes = {};      // modeId -> [map names]
let modeLabels = {}; // modeId -> display label

const $ = (id) => document.getElementById(id);

async function getJSON(url) {
	const res = await fetch(url);
	if (!res.ok) throw new Error('HTTP ' + res.status);
	return res.json();
}

async function boot() {
	try { manifest = (await getJSON('../../maps/index.json')).maps || []; } catch (e) { manifest = []; }
	try {
		const data = await getJSON('../../maps/curated.json');
		for (const c of (data.maps || [])) curated[c.name] = c;
	} catch (e) { /* curated optional */ }
	try {
		const data = await getJSON('../../maps/modes.json');
		modes = data.modes || {};
		modeLabels = data.labels || {};
	} catch (e) { /* no mode pools */ }
	route();
}

function params() { return new URLSearchParams(location.search); }

function route() {
	const p = params();
	const mapName = p.get('map');
	if (mapName) renderMap(mapName, p.get('mode'));
	else renderIndex();
}

/* ---------------- index ---------------- */
function renderIndex() {
	$('app').classList.add('wide');
	$('topbar').innerHTML = '<a class="button" href="./index.html">🏠 Index</a> <span class="muted">Battle Dome map browser</span>';
	const byName = {};
	for (const m of manifest) byName[m.name] = m;

	const volunteers = manifest.filter((m) => m.format === 'txt');
	const poolNames = new Set();
	for (const k in modes) for (const n of modes[k]) poolNames.add(n);
	const other = manifest.filter((m) => m.format === 'curated' && !poolNames.has(m.name));

	let html = '<h1>Battle Dome — Map Browser</h1>';
	html += '<p class="map-info">' + manifest.length + ' maps · <a href="./MAPS.md">SVG gallery</a> · <a href="../index.html">map editor</a></p>';
	html += '<div class="mode-row">';
	if (Object.keys(modes).length) {
		for (const k in modes) {
			html += '<a class="button primary" href="#mode-' + encodeURIComponent(k) + '">' + esc(modeLabels[k] || k) + ' (' + modes[k].length + ')</a> ';
		}
	}
	html += '<a class="button" href="#all">All maps</a></div>';

	if (volunteers.length) {
		html += section('Volunteer', volunteers.map((m) => linkFor(m)));
	}
	if (Object.keys(modes).length) {
		for (const k in modes) {
			const list = modes[k].map((n) => byName[n]).filter(Boolean);
			if (!list.length) continue;
			html += section(modeLabels[k] || k + ' pool', list.map((m) => linkFor(m)), 'mode-' + k);
		}
	}
	if (other.length) {
		html += section('Other curated', other.map((m) => linkFor(m)), 'all');
	}
	if (!manifest.length) {
		html = '<p id="status">No maps found — the map data failed to load. Try a hard refresh (Ctrl+Shift+R).</p>';
	}
	$('content').innerHTML = html;
}

function section(title, links, id) {
	return '<div class="section"' + (id ? ' id="' + id + '"' : '') + '><h2>' + esc(title) + '</h2><div class="map-links">' + links.join('') + '</div></div>';
}

function linkFor(m) {
	return '<a href="./index.html?map=' + encodeURIComponent(m.name) + '" title="' + esc(m.display || m.name) + ' · ' + m.rows + '×' + m.cols + '">' + esc(m.display || m.name) + '<small>' + m.rows + '×' + m.cols + '</small></a>';
}

/* ---------------- single map ---------------- */
async function renderMap(name, mode) {
	$('app').classList.remove('wide');
	const entry = manifest.find((m) => m.name === name);
	if (!entry) {
		$('content').innerHTML = '<p id="status">Map "' + esc(name) + '" not found.</p><a class="button" href="./index.html">← Back to index</a>';
		return;
	}

	let map = null;
	try {
		if (entry.format === 'curated') {
			map = curated[name];
			if (!map) throw new Error('curated data missing');
		} else if (entry.format === 'txt') {
			const res = await fetch('../../maps/' + entry.file);
			map = MC.parseTxt(await res.text(), entry.file);
		} else {
			map = MC.normalizeMap(await getJSON('../../maps/' + entry.file));
		}
	} catch (e) {
		$('content').innerHTML = '<p id="status">Could not load "' + esc(name) + '": ' + esc(e.message) + '</p><a class="button" href="./index.html">← Back to index</a>';
		return;
	}
	if (!map || !map.tiles || !map.tiles.length) {
		$('content').innerHTML = '<p id="status">Map "' + esc(name) + '" is empty.</p><a class="button" href="./index.html">← Back to index</a>';
		return;
	}

	// Navigation context: the mode pool, or every map.
	let ctx = manifest.map((m) => m.name);
	if (mode && modes[mode] && modes[mode].length) {
		ctx = modes[mode].filter((n) => manifest.some((m) => m.name === n));
	}
	const idx = ctx.indexOf(name);
	const prev = idx > 0 ? ctx[idx - 1] : null;
	const next = idx >= 0 && idx < ctx.length - 1 ? ctx[idx + 1] : null;

	let top = '<a class="button" href="./index.html">← Return to index</a>';
	if (mode && modeLabels[mode]) {
		top += ' <a class="button" href="./index.html?mode=' + encodeURIComponent(mode) + '#mode-' + encodeURIComponent(mode) + '">Return to ' + esc(modeLabels[mode]) + '</a>';
	}
	if (prev) top += '<a class="button nav-abs nav-left" href="./index.html?map=' + encodeURIComponent(prev) + (mode ? '&mode=' + encodeURIComponent(mode) : '') + '">&lt;&lt; ' + esc(displayOf(prev)) + '</a>';
	if (next) top += '<a class="button nav-abs nav-right" href="./index.html?map=' + encodeURIComponent(next) + (mode ? '&mode=' + encodeURIComponent(mode) : '') + '">' + esc(displayOf(next)) + ' &gt;&gt;</a>';
	$('topbar').innerHTML = top;

	const display = entry.display || entry.name;
	$('content').innerHTML =
		'<div class="center"><h1>' + esc(display) + '</h1>' +
		'<p class="map-info">' + map.rows + '×' + map.cols + (mode && modeLabels[mode] ? ' · ' + esc(modeLabels[mode]) + ' pool' : '') + '</p>' +
		'<div class="map-stage"><div style="display:inline-block;overflow-x:auto">' + tableHTML(map) + '</div></div></div>';
}

function displayOf(name) {
	const m = manifest.find((x) => x.name === name);
	return (m && m.display) || name;
}

function tableHTML(map) {
	const rows = map.tiles.length;
	const cols = map.tiles[0].length;
	let h = '<table class="bdmap"><tr style="min-height:28px;height:24px"><td style="min-width:22px"></td>';
	for (let c = 0; c < cols; c++) h += '<td style="min-width:22px"><b>' + (c + 1) + '</b></td>';
	h += '</tr>';
	for (let r = 0; r < rows; r++) {
		h += '<tr style="min-height:24px;height:24px"><td><b>' + rowLabel(r) + '</b></td>';
		for (let c = 0; c < cols; c++) {
			const t = map.tiles[r][c] || 'normal';
			h += '<td class="tile" style="background:' + (COLORS[t] || COLORS.normal) + '" title="' + esc(t) + '"></td>';
		}
		h += '</tr>';
	}
	return h + '</table>';
}

function esc(s) {
	return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

boot();
</script>
</body>
</html>
